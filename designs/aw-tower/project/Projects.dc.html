<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aw.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&amp;family=Space+Grotesk:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app">

<header class="top">
  <div class="top-l">
    <a class="brand" href="Projects.dc.html" aria-label="全部项目">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="25" height="25" rx="6" stroke="currentColor" stroke-opacity="0.35"></rect><path d="M6 8.5h9M6 13h13M6 17.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path><circle cx="19" cy="8.5" r="2" style="fill: var(--accent)"></circle></svg>
    </a>
    <span class="crumbs"><span class="here">Agent Workstation</span></span>
  </div>
  <div class="top-r">
    <span class="live hide-s"><i class="dot dot-ok"></i>实时</span>
    <a class="btn btn-quiet" href="Settings.dc.html">设置</a>
    <span class="me">本地用户</span>
  </div>
</header>

<main class="home">
  <div class="row-wrap" style="justify-content: space-between; gap: 16px">
    <h1 class="headline">项目</h1>
    <button class="btn btn-primary" type="button">新建项目</button>
  </div>

  <article class="card proj">
    <div class="row-wrap" style="justify-content: space-between; gap: 12px; align-items: flex-start">
      <div class="stack grow" style="gap: 4px; flex-basis: 320px">
        <h2 class="proj-name"><a href="Main.dc.html">Agent Workstation</a></h2>
        <p class="muted">用工作台开发工作台本身</p>
      </div>
      <a class="tag tag-amber" href="Inbox.dc.html" style="min-height: 28px; padding: 0 10px; font-size: 13px">4 件事在等你</a>
    </div>

    <figure class="lanes" role="img" aria-label="这个项目最近 42 分钟的 Agent 运行时段，三个 Agent 此刻在跑，一个在等你。">
      <ul class="lane-names" aria-hidden="true"><li>架构师</li><li>前端开发</li><li>测试工程师</li><li>审查</li></ul>
      <div class="lane-plot" aria-hidden="true">
        <div class="lane-axis measured"><span style="left: 0%">09:40</span><span style="left: 23.8%">09:50</span><span style="left: 47.6%">10:00</span><span style="left: 71.4%">10:10</span></div>
        <i class="lane-grid" style="left: 23.8%"></i><i class="lane-grid" style="left: 47.6%"></i><i class="lane-grid" style="left: 71.4%"></i>
        <div class="lane-track"><i class="seg" style="left: 2%; width: 12.5%"></i><i class="seg" style="left: 30%; width: 6%"></i><i class="seg seg-live" style="left: 86%; width: 13.6%"></i></div>
        <div class="lane-track"><i class="seg" style="left: 15%; width: 23.5%"></i><i class="seg" style="left: 44%; width: 18%"></i><i class="seg seg-live" style="left: 70%; width: 29.6%"></i></div>
        <div class="lane-track"><i class="seg" style="left: 39%; width: 7.5%"></i><i class="seg" style="left: 79%; width: 14%"></i><i class="seg seg-wait" style="left: 93.3%; width: 6.3%"></i></div>
        <div class="lane-track"><i class="seg" style="left: 47%; width: 11%"></i><i class="seg" style="left: 59%; width: 5.5%"></i><i class="seg seg-live" style="left: 84%; width: 15.6%"></i></div>
        <i class="now" style="left: 99.7%"><span class="measured">现在</span></i>
      </div>
    </figure>

    <dl class="readings">
      <div><dt>工作台</dt><dd>2</dd></div>
      <div><dt>进行中</dt><dd>5</dd></div>
      <div><dt>完成</dt><dd>18</dd></div>
      <div><dt>阻塞</dt><dd class="t-amber">1</dd></div>
      <div><dt>待处理</dt><dd class="t-amber">4</dd></div>
    </dl>
  </article>

  <article class="card proj">
    <div class="row-wrap" style="justify-content: space-between; gap: 12px">
      <div class="stack grow" style="gap: 4px; flex-basis: 320px">
        <h2 class="title"><a href="Main.dc.html">个人站点改版</a></h2>
        <p class="muted">把博客迁到静态站，保留旧链接</p>
      </div>
      <span class="row xs muted"><i class="dot"></i>全部待命，没有事情等你</span>
    </div>
    <p class="row-wrap xs muted" style="gap: 16px"><span>工作台 <span class="measured ink2">2</span></span><span>进行中 <span class="measured ink2">0</span></span><span>完成 <span class="measured ink2">7</span></span></p>
  </article>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
