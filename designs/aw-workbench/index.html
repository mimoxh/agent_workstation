<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Workstation 工作台原型</title>
<meta name="description" content="文档式工作台原型：控制台为默认主界面，顶栏标签切换工作台，左侧栏切换工作台内的群聊、任务页、数据库视图与团队。">
<style>
/* 文档式风格：浅色为主、暖灰侧栏、大标题页面、属性行、callout、数据库视图。跟随系统切换深色。
   颜色语义沿用 AGENTS.md：橙 = 等人，蓝 = 机器在动，红 = 出问题，绿 = 收口。主按钮用墨色，不占语义色。 */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --bg-side: #f7f7f5;
  --bg-soft: #f7f6f3;
  --bg-hover: rgba(55, 53, 47, 0.06);
  --bg-active: rgba(55, 53, 47, 0.09);
  --text: #37352f;
  --text-2: rgba(55, 53, 47, 0.85);
  --muted: rgba(55, 53, 47, 0.62);
  --faint: rgba(55, 53, 47, 0.42);
  --line: rgba(55, 53, 47, 0.09);
  --line-2: rgba(55, 53, 47, 0.16);
  --btn-bg: #37352f;
  --btn-bg-hover: #4a4842;
  --btn-text: #ffffff;
  --focus: rgba(35, 131, 226, 0.57);
  --link: #37352f;
  --shadow-card: rgba(15, 15, 15, 0.08) 0 0 0 1px, rgba(15, 15, 15, 0.08) 0 2px 4px;
  --shadow-pop: rgba(15, 15, 15, 0.05) 0 0 0 1px, rgba(15, 15, 15, 0.1) 0 3px 6px, rgba(15, 15, 15, 0.2) 0 9px 24px;
  --toast-bg: #2f2f2f;
  --toast-text: rgba(255, 255, 255, 0.92);

  /* 语义：文字色 / callout 底 / 标签底 / 标签字 */
  --wait: #c2620c;      --wait-bg: #fbecdd;  --wait-tag: #fadec9;  --wait-tag-text: #49290e;
  --run: #2f78a8;       --run-bg: #e7f3f8;   --run-tag: #d3e5ef;   --run-tag-text: #183347;
  --ok: #448361;        --ok-bg: #edf3ec;    --ok-tag: #dbeddb;    --ok-tag-text: #1c3829;
  --bad: #c9403b;       --bad-bg: #fdebec;   --bad-tag: #ffe2dd;   --bad-tag-text: #5d1715;
  --gray-tag: #e9e8e6;  --gray-tag-text: #32302c;
  --add-bg: #edf3ec; --del-bg: #fdebec;

  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", Helvetica, Arial, sans-serif;
  --mono: "SFMono-Regular", Menlo, Consolas, "Cascadia Mono", "Microsoft YaHei UI", monospace;

  --top-h: 44px;
  --side-w: 248px;
  --panel-w: 340px;
  --r: 6px;
  --r-sm: 4px;
  --dur: 120ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #191919; --bg-side: #202020; --bg-soft: #252525;
    --bg-hover: rgba(255, 255, 255, 0.055); --bg-active: rgba(255, 255, 255, 0.085);
    --text: rgba(255, 255, 255, 0.86); --text-2: rgba(255, 255, 255, 0.78); --muted: rgba(255, 255, 255, 0.5); --faint: rgba(255, 255, 255, 0.34);
    --line: rgba(255, 255, 255, 0.094); --line-2: rgba(255, 255, 255, 0.15);
    --btn-bg: rgba(255, 255, 255, 0.88); --btn-bg-hover: #ffffff; --btn-text: #191919;
    --link: rgba(255, 255, 255, 0.86);
    --shadow-card: rgba(0, 0, 0, 0.3) 0 0 0 1px, rgba(0, 0, 0, 0.25) 0 2px 4px;
    --shadow-pop: rgba(255, 255, 255, 0.09) 0 0 0 1px, rgba(0, 0, 0, 0.3) 0 3px 6px, rgba(0, 0, 0, 0.4) 0 9px 24px;
    --toast-bg: #3a3a3a;
    --wait: #d98a4a; --wait-bg: #36291f; --wait-tag: #854c1d; --wait-tag-text: rgba(255, 255, 255, 0.9);
    --run: #5aa0cf; --run-bg: #1f2a33; --run-tag: #28456c; --run-tag-text: rgba(255, 255, 255, 0.9);
    --ok: #5fa57c; --ok-bg: #222b26; --ok-tag: #2b593f; --ok-tag-text: rgba(255, 255, 255, 0.9);
    --bad: #e06a62; --bad-bg: #362422; --bad-tag: #6e3630; --bad-tag-text: rgba(255, 255, 255, 0.9);
    --gray-tag: #3a3a3a; --gray-tag-text: rgba(255, 255, 255, 0.85);
    --add-bg: #223325; --del-bg: #3a2323;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #191919; --bg-side: #202020; --bg-soft: #252525;
  --bg-hover: rgba(255, 255, 255, 0.055); --bg-active: rgba(255, 255, 255, 0.085);
  --text: rgba(255, 255, 255, 0.86); --text-2: rgba(255, 255, 255, 0.78); --muted: rgba(255, 255, 255, 0.5); --faint: rgba(255, 255, 255, 0.34);
  --line: rgba(255, 255, 255, 0.094); --line-2: rgba(255, 255, 255, 0.15);
  --btn-bg: rgba(255, 255, 255, 0.88); --btn-bg-hover: #ffffff; --btn-text: #191919;
  --link: rgba(255, 255, 255, 0.86);
  --shadow-card: rgba(0, 0, 0, 0.3) 0 0 0 1px, rgba(0, 0, 0, 0.25) 0 2px 4px;
  --shadow-pop: rgba(255, 255, 255, 0.09) 0 0 0 1px, rgba(0, 0, 0, 0.3) 0 3px 6px, rgba(0, 0, 0, 0.4) 0 9px 24px;
  --toast-bg: #3a3a3a;
  --wait: #d98a4a; --wait-bg: #36291f; --wait-tag: #854c1d; --wait-tag-text: rgba(255, 255, 255, 0.9);
  --run: #5aa0cf; --run-bg: #1f2a33; --run-tag: #28456c; --run-tag-text: rgba(255, 255, 255, 0.9);
  --ok: #5fa57c; --ok-bg: #222b26; --ok-tag: #2b593f; --ok-tag-text: rgba(255, 255, 255, 0.9);
  --bad: #e06a62; --bad-bg: #362422; --bad-tag: #6e3630; --bad-tag-text: rgba(255, 255, 255, 0.9);
  --gray-tag: #3a3a3a; --gray-tag-text: rgba(255, 255, 255, 0.85);
  --add-bg: #223325; --del-bg: #3a2323;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: not-allowed; opacity: 0.5; }
[hidden] { display: none !important; }
code, kbd, .m { font-family: var(--mono); font-size: 0.86em; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: var(--r-sm); }
.ic { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--muted); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ── 基础件 ─────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r); font-size: 14px; white-space: nowrap; color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); transition: background-color var(--dur); }
.btn:hover { background: var(--bg-hover); }
.btn:active { background: var(--bg-active); }
.btn.pri { background: var(--btn-bg); color: var(--btn-text); box-shadow: none; font-weight: 500; }
.btn.pri:hover { background: var(--btn-bg-hover); }
.btn.quiet { box-shadow: none; color: var(--muted); }
.btn.quiet:hover { color: var(--text); }
.btn.quiet[aria-pressed="true"] { background: var(--bg-active); color: var(--text); }
.btn.icon { width: 28px; padding: 0; }
.btn.sm { height: 24px; padding: 0 8px; font-size: 13px; }
.lnk { color: var(--muted); border-radius: var(--r-sm); padding: 2px 4px; transition: background-color var(--dur), color var(--dur); }
.lnk:hover { color: var(--text); background: var(--bg-hover); }
.ref { color: var(--link); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; cursor: pointer; font-weight: 500; }
.ref:hover { text-decoration-color: currentColor; }

.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 3px; font-size: 12px; line-height: 20px; white-space: nowrap; background: var(--gray-tag); color: var(--gray-tag-text); }
.tag.wait { background: var(--wait-tag); color: var(--wait-tag-text); }
.tag.run { background: var(--run-tag); color: var(--run-tag-text); }
.tag.ok { background: var(--ok-tag); color: var(--ok-tag-text); }
.tag.bad { background: var(--bad-tag); color: var(--bad-tag-text); }
.count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; font-weight: 600; background: var(--wait-tag); color: var(--wait-tag-text); }
.count.run { background: var(--run-tag); color: var(--run-tag-text); }
.t-wait { color: var(--wait); } .t-run { color: var(--run); } .t-ok { color: var(--ok); } .t-bad { color: var(--bad); }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--run); flex-shrink: 0; }
.dot.ok { background: var(--ok); }

.av { position: relative; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; font-size: 11px; font-weight: 600; color: var(--text-2); background: var(--gray-tag); }
.av.me { background: var(--wait-tag); color: var(--wait-tag-text); }
.av.lg { width: 28px; height: 28px; font-size: 12px; }
.av.xs { width: 20px; height: 20px; font-size: 10px; }
.av .ring { position: absolute; inset: -2px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--run); }
.av .ring.wait { box-shadow: 0 0 0 1.5px var(--wait); }
.stack { display: inline-flex; }
.stack .av { margin-left: -6px; box-shadow: 0 0 0 2px var(--bg); }
.stack .av:first-child { margin-left: 0; }
.people { display: inline-flex; align-items: center; gap: 6px; }

.meter { display: inline-block; width: 80px; height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; vertical-align: middle; }
.meter i { display: block; height: 100%; border-radius: 2px; background: var(--muted); transform-origin: left; }
.meter i.hot { background: var(--wait); }

/* ── 外壳 ───────────────────────────── */
.app { display: grid; grid-template-rows: var(--top-h) minmax(0, 1fr); height: 100dvh; }
.top { display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--line); background: var(--bg); min-width: 0; }
.menu-btn { display: none; }
.proj { position: relative; flex-shrink: 0; }
.proj-btn { display: inline-flex; align-items: center; gap: 8px; height: 30px; max-width: 240px; padding: 0 8px 0 6px; border-radius: var(--r); font-weight: 600; transition: background-color var(--dur); }
.proj-btn:hover, .proj-btn[aria-expanded="true"] { background: var(--bg-hover); }
.proj-btn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-btn .ic { width: 12px; height: 12px; color: var(--faint); }
.tile { display: grid; place-items: center; width: 22px; height: 22px; border-radius: var(--r-sm); flex-shrink: 0; font-size: 12px; font-weight: 600; color: var(--btn-text); background: var(--btn-bg); }
.tile.soft { color: var(--text-2); background: var(--gray-tag); }
.menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 100; width: 300px; padding: 6px; border-radius: 8px; background: var(--bg); box-shadow: var(--shadow-pop); }
.menu-h { padding: 4px 8px 6px; font-size: 12px; color: var(--muted); }
.menu-i { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border-radius: var(--r-sm); transition: background-color var(--dur); }
.menu-i:hover { background: var(--bg-hover); }
.menu-i[aria-current="true"] { background: var(--bg-active); }
.menu-i .sub { display: block; font-size: 12px; color: var(--muted); }
.menu-sep { height: 1px; margin: 6px 0; background: var(--line); }

.tabs { display: flex; align-items: stretch; align-self: stretch; flex: 1; min-width: 0; margin-left: 8px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; white-space: nowrap; color: var(--muted); transition: color var(--dur); }
.tab .ic { width: 15px; height: 15px; }
.tab::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--text); opacity: 0; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); font-weight: 500; }
.tab[aria-selected="true"]::after { opacity: 1; }
.tab .par { color: var(--faint); font-weight: 400; }
.tab-sep { width: 1px; margin: 12px 4px; background: var(--line-2); flex-shrink: 0; }
.tab-add { display: inline-grid; place-items: center; align-self: center; width: 26px; height: 26px; margin-left: 2px; border-radius: var(--r); color: var(--faint); flex-shrink: 0; }
.tab-add:hover { color: var(--text); background: var(--bg-hover); }
.top-r { display: flex; align-items: center; gap: 4px; flex-shrink: 0; padding-left: 8px; }
.sync { display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }

.body { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 0; }
.side { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; padding: 10px 8px 10px; background: var(--bg-side); border-right: 1px solid var(--line); }
.side-h { display: flex; align-items: center; gap: 8px; padding: 4px 8px 2px; }
.side-h b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-h .sub { display: block; font-size: 12px; color: var(--muted); }
.grp { display: grid; gap: 1px; }
.grp-h { display: flex; align-items: center; justify-content: space-between; height: 26px; padding: 0 4px 0 8px; font-size: 12px; font-weight: 600; color: var(--faint); }
.grp-h .btn.icon { width: 22px; height: 22px; opacity: 0; transition: opacity var(--dur); }
.grp:hover .grp-h .btn.icon, .grp-h .btn.icon:focus-visible { opacity: 1; }
.nav { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 8px; border-radius: var(--r); color: var(--text-2); transition: background-color var(--dur); }
.nav:hover { background: var(--bg-hover); }
.nav[aria-current="page"] { background: var(--bg-active); color: var(--text); font-weight: 500; }
.nav .ic { color: var(--muted); }
.nav .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .aside { flex-shrink: 0; font-size: 12px; color: var(--faint); font-weight: 400; }
.nav.unread .lb { color: var(--text); font-weight: 600; }
.side-f { margin-top: auto; display: grid; gap: 6px; padding: 10px 8px 2px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.side-f .row { display: flex; justify-content: space-between; gap: 8px; }
.side-f .meter { width: 100%; }
.scrim { display: none; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w); flex: 1; min-height: 0; }
.panel { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--bg); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }
.page { padding: 0 72px 80px; }
.page-in { max-width: 860px; margin: 0 auto; }
.page.wide { padding-left: 40px; padding-right: 40px; }
.page.wide .page-in { max-width: none; }

/* 页面头：图标、大标题、说明、属性 */
.ph { padding-top: 44px; }
.ph-icon { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 10px; color: var(--muted); background: var(--bg-soft); box-shadow: inset 0 0 0 1px var(--line); font-size: 16px; font-weight: 700; }
.ph-icon .ic { width: 26px; height: 26px; stroke-width: 1.5; }
.ph-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.ph-row .sp { flex: 1; }
.ph h1 { margin-top: 14px; font-size: 38px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: break-word; }
.ph .desc { margin-top: 6px; color: var(--muted); }
.ph-tools { display: flex; align-items: center; gap: 6px; padding-bottom: 6px; }

.props { display: grid; gap: 2px; margin-top: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.prop { display: grid; grid-template-columns: 140px minmax(0, 1fr); align-items: center; min-height: 32px; }
.prop .k { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.prop .k .ic { width: 15px; height: 15px; }
.prop .v { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-width: 0; padding: 4px 6px; border-radius: var(--r-sm); }
.steps { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.steps .s { font-size: 13px; color: var(--faint); }
.steps .s.past { color: var(--muted); }
.steps .s.cur { color: var(--run-tag-text); background: var(--run-tag); padding: 0 6px; border-radius: 3px; }
.steps .arrow { color: var(--faint); font-size: 12px; }

h2.blk { margin: 32px 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -0.005em; }
.blk-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 32px 0 6px; }
.blk-row h2 { font-size: 22px; font-weight: 600; }
h3.blk { margin: 18px 0 4px; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.hint { color: var(--muted); font-size: 13px; }

/* callout 与块 */
.callout { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--bg-soft); }
.callout > .ic { width: 18px; height: 18px; margin-top: 2px; color: var(--muted); }
.callout.wait { background: var(--wait-bg); } .callout.wait > .ic { color: var(--wait); }
.callout.run { background: var(--run-bg); } .callout.run > .ic { color: var(--run); }
.callout.ok { background: var(--ok-bg); } .callout.ok > .ic { color: var(--ok); }
.callout b { font-weight: 600; }
.callout .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.callout .note { font-size: 12px; color: var(--muted); }
.quote { padding: 2px 0 2px 14px; border-left: 3px solid var(--text); color: var(--text-2); }
.quote .from { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; font-size: 12px; color: var(--muted); }
.pagelink { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px; margin-left: -4px; border-radius: var(--r-sm); font-weight: 500; transition: background-color var(--dur); }
.pagelink:hover { background: var(--bg-hover); }
.pagelink .ic { color: var(--muted); }
.pagelink span { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
pre.code { margin: 8px 0 0; padding: 12px 14px; overflow-x: auto; border-radius: var(--r-sm); background: var(--bg); font: 13px/1.6 var(--mono); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.bookmark { display: grid; gap: 6px; padding: 12px 14px; border-radius: var(--r-sm); box-shadow: inset 0 0 0 1px var(--line-2); }
.bookmark .t { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.bookmark .t .sp { flex: 1; }
.bookmark .acts { display: flex; gap: 6px; }
.diffstat { font-family: var(--mono); font-size: 12px; font-weight: 400; }
.diffstat .a { color: var(--ok); } .diffstat .d { color: var(--bad); }

.todo { display: grid; gap: 2px; }
.todo li { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.box { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 3px; box-shadow: inset 0 0 0 1.5px var(--muted); flex-shrink: 0; }
.todo .done .box { background: var(--run); box-shadow: none; color: var(--bg); }
.todo .done .box .ic { width: 12px; height: 12px; stroke-width: 2.6; }
.todo .done span { color: var(--faint); text-decoration: line-through; }

/* ── 统计 ───────────────────────────── */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
.stat { padding: 12px 14px; border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--line-2); }
.stat .l { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.stat .l .ic { width: 14px; height: 14px; }
.stat .v { margin-top: 4px; font-size: 26px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat .v .u { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 2px; }

.db .nm-wrap { display: inline-flex; align-items: center; gap: 8px; }

// 路由放内存里，hash 只做可分享的同步（data: 与快照环境下 hash 不可写）
// #/console/<view>[/<arg>]  ·  #/<project>/<ws>/<view>[/<arg>]
S.hash = location.hash;
function parse() {
  const seg = (S.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  if (!seg.length || seg[0] === 'console') return { tab: 'console', view: seg[1] || 'overview', arg: seg[2] };
  const [p, ws, view, arg] = seg;
  if (!P[p] || !wsOf(p, ws)) return { tab: 'console', view: 'overview' };
  S.project = p;
  return { tab: ws, view: view || 'chat', arg };
}
const wsHash = (p, ws, view = 'chat', arg) => `#/${p}/${ws}/${view}${arg ? '/' + arg : ''}`;
const go = (h) => {
  if (h.startsWith('task:')) h = wsHash(S.project, S.route.tab, 'task', h.slice(5));
  S.hash = h;
  try { if (location.hash !== h) history.pushState(null, '', h); } catch (e) {}
  render();
};

function toast(msg) {
  const el = $('#toast');
  el.innerHTML = `<div class="toast">${msg}</div>`;
  clearTimeout(toast.h);
  toast.h = setTimeout(() => { el.innerHTML = ''; }, 2400);
}

function av(key, st, size = '') {
  const a = A[key];

function card(c, p) {
  const done = c.id && S.resolved[c.id];
  const resolvedLine = done ? `<span class="note">${esc(done)} · 原型本地状态</span>` : '';
  switch (c.k) {
    case 'dispatch': {
      const x = taskOf(p, c.task);
      return `<div class="callout run">${ic('bolt')}<div><b>派发给 ${esc(c.to)}</b>
        <div style="margin-top:4px"><button class="pagelink" data-go="${wsHash(p, x.w.id, 'task', c.task)}">${ic('doc')}<span>${esc(x.t.title)}</span></button></div>
        <p class="hint" style="margin-top:2px">预算 ${x.t.tok[1]}k tok · 起点 ${esc(x.w.stages[0])}</p></div></div>`;
    }
    case 'handoff':
      return `<div class="quote"><p class="from">${av(c.from, '', 'xs')}${esc(A[c.from].n)} ${ic('arrow', 'style="width:12px;height:12px"')} ${av(c.to, '', 'xs')}${esc(A[c.to].n)}　交接</p>${esc(c.sum)}</div>`;
    case 'block':
      return `<div class="callout ${done ? '' : 'wait'}">${ic('hand')}<div><b>需要你决定</b><p style="margin-top:2px">${esc(c.q)}</p>
        <div class="acts">${done ? resolvedLine : `<button class="btn pri" data-act="resolve" data-id="${c.id}" data-endpoint="/api/inbox/${c.id}/resolve" data-label="你已回复">回复</button><button class="btn" data-act="resolve" data-id="${c.id}" data-endpoint="/api/inbox/${c.id}/resolve" data-label="已交给项目经理分诊">交给项目经理分诊</button>`}</div></div></div>`;
    case 'command':
      return `<div class="callout ${done ? '' : 'wait'}">${ic('terminal')}<div><b>命令确认</b><span class="hint">　worktree ${esc(c.task)}</span><pre class="code">${esc(c.cmd)}</pre>
        <div class="acts">${done ? resolvedLine : `<button class="btn pri" data-act="resolve" data-id="${c.id}" data-endpoint="/api/inbox/${c.id}/resolve" data-label="你已允许">允许</button><button class="btn" data-act="resolve" data-id="${c.id}" data-endpoint="/api/inbox/${c.id}/resolve" data-label="你已拒绝">拒绝</button><span class="note">本任务内同类命令不再询问</span>`}</div></div></div>`;
    case 'proposal':
      return `<div class="bookmark"><div class="t">${ic('diff')}提案 ${c.pr} rev ${c.rev}<span class="sp"></span><span class="diffstat"><span class="a">+${c.add}</span> <span class="d">−${c.del}</span> · ${c.files} 个文件</span></div>

  }
  return '';
}

  return `<div class="queue">${items.map((i) => {
    const w = wsOf(i.p, i.ws);
    const t = taskOf(i.p, i.task)?.t;
    const done = S.resolved[i.id];
    const acts = done ? `<span class="resolved">${esc(done)}</span>` : i.acts.map(([label, kind], k) => {
      if (kind === 'review') return `<button class="btn sm" data-go="${wsHash(i.p, i.ws, 'changes')}">${label}</button>`;
      if (kind === 'reply') return `<button class="btn sm" data-go="${wsHash(i.p, i.ws, 'task', i.task)}">${label}</button>`;
      return `<button class="btn sm ${k === 0 ? 'pri' : ''}" data-act="resolve" data-id="${i.id}" data-endpoint="/api/inbox/${i.id}/resolve" data-decision="${kind}" data-label="你已${label}">${label}</button>`;
    }).join('');
    return `<div class="q ${done ? 'done' : ''}">
      <span><span class="tag ${i.tone}">${i.kind}</span></span>

function sendMsg(form) {
  const ta = form.querySelector('textarea');
  const tx = ta.value.trim();
  if (!tx) return;
  const [kind, id] = form.dataset.target.split(':');
  const now = new Date();
  const t = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  const m = { who: 'me', t, tx, raw: true };
  if (kind === 'pm') P[id].ws.find((w) => w.root).chat.push(m);
  else if (kind === 'ws') wsOf(S.project, id).chat.push(m);
  else (TASK_FEED[id] ||= [{ day: '今天' }]).push(m);
  renderMain();
  const mention = tx.match(/@(\S+)/);
  if (mention) toast(`提及了 ${esc(mention[1])}，它排进下一轮发言`);
}

document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); S.menu = false; go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]');
  if (!a) { if (S.menu && !e.target.closest('.menu')) { S.menu = false; renderTop(); } return; }
  const act = a.dataset.act;
  if (act === 'menu') { S.menu = !S.menu; renderTop(); }
  else if (act === 'proj') {
    const id = a.dataset.id; S.menu = false; S.project = id;
    if (S.route.tab === 'console' || a.dataset.stay) { render(); toast(`顶栏标签换成了「${P[id].name}」的工作台`); }
    else go(wsHash(id, P[id].ws[1]?.id || P[id].ws[0].id, 'chat'));
  }
  else if (act === 'resolve') resolve(a);
  else if (act === 'pmproj') { S.pmProject = a.dataset.id; renderMain(); }
  else if (act === 'members') { S.members = !S.members; save(); renderMain(); }
  else if (act === 'side') $('#app').classList.toggle('side-open');
  else if (act === 'mount') toast('挂载工作台：选插件，选父工作台，新标签出现在顶栏');
  else if (act === 'newproj') toast('新建项目：沿用现有对话框，原型未展开');
  else if (act === 'newtask') toast('新建任务：建好后在左侧「群聊」下出现一个任务页');
  else if (act === 'advance') toast('推进阶段需要先满足门槛：验收或审批');
  else if (act === 'palette') toast('Ctrl K：跨项目搜索工作台、任务和成员');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('tr.go')) { go(e.target.dataset.go); return; }
  if (e.target.matches('.composer textarea') && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(e.target.closest('form')); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); toast('Ctrl K：跨项目搜索工作台、任务和成员'); }
  if (e.key === 'Escape') { if (S.menu) { S.menu = false; renderTop(); } $('#app').classList.remove('side-open'); }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-act="send"]');
  if (f) { e.preventDefault(); sendMsg(f); }
});
window.addEventListener('popstate', () => { S.hash = location.hash; render(); });
render();
</script>
</body>
</html>
