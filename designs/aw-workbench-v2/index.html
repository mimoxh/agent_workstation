<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Workstation 工作台原型</title>
<meta name="description" content="控制台为默认主界面，顶栏标签切换工作台，左侧栏切换工作台内的群聊、任务群、板块与团队。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Noto+Serif+SC:wght@400;500&family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Hallmark · shape: app screen · genre: atmospheric · theme: Lumen (deal 1/3, seed multi-agent-collaboration-workbench-cross-project-bf96·d19b670b·2026-11-07·r0) · redesign: full
 * nav: top bar with project switcher and workstation tabs, a second-neutral sidebar per tab · signature: the collaboration feed, agents posting typed cards (dispatch, handoff, decision, command, proposal, conclusion) that you answer in place · states: full, empty (queue, members), resolved-local
 * axes: dark/roman-serif/warm · posture: restrained · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V4 · weakest: S, a dark chat app reads like any chat; made the typed cards and the figures strip carry the product, cards answer in place and the console leads with what waits on you */
/* Hallmark · project semantics kept from AGENTS.md: brass waits on a person, cool means a machine is moving, rose is a problem, green is closed; the rose leaves the hero verb (there is no hero) to carry problems */
/* Hallmark · reworded "长篇小说 · 雾港" to "长篇小说 雾港" · 63 names the joined meta string */
/* Hallmark · dropped "项目 +" · the side group heads are labels inside labelled nav elements now, no longer h3 */
/* Hallmark · dismissed 70 · a static prototype with no backend; every action names its real route in data-endpoint (POST /api/inbox/:id/resolve, POST /api/proposals/:id/approve) and the resolved line says it is local */
/* Hallmark · answered F7 · .nav and .search are controls; counts and meters moved off the pill radius */
/* Hallmark · answered F21 · on screen the h3 sits under an h2; the script builds the project tables before the template that holds the h2 */
/* Hallmark · Latin lowercase register skipped: the UI is Chinese and task titles carry identifiers (TestRun, SSE, pnpm) that must survive */

:root {
  color-scheme: dark;
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px; --space-3xl: 96px; --space-4xl: 144px;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-xl: 1.44rem; --text-2xl: 1.728rem; --text-3xl: 2.074rem;
  --text-display-s: 1.44rem; --text-display: 1.728rem; --text-section: 1.2rem; --text-title: 1rem; --text-lead: 1rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-in: cubic-bezier(0.7, 0, 0.84, 0); --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-micro: 120ms; --dur-short: 220ms; --dur-long: 420ms;
  --color-error: oklch(72% 0.15 27); --color-success: oklch(76% 0.13 150);
  --z-base: 1; --z-raised: 10; --z-dropdown: 100; --z-sticky: 200; --z-sticky-nav: 300; --z-modal: 400; --z-toast: 500; --z-tooltip: 600;
  --color-paper: oklch(12.5% 0.027 290); --color-paper-2: oklch(16% 0.03 290); --color-paper-3: oklch(20% 0.032 290);
  --color-ink: oklch(96% 0.01 300); --color-ink-2: oklch(85% 0.017 298); --color-muted: oklch(69% 0.026 295);
  --color-rule: oklch(27% 0.034 290); --color-rule-2: oklch(36% 0.04 292); --rule-blueprint: oklch(96% 0.01 300 / 0.05);
  --color-accent: oklch(80% 0.15 62); --color-accent-2: oklch(72% 0.15 12); --color-accent-ink: oklch(14% 0.028 290);
  --color-live: oklch(80% 0.13 155); --color-focus: oklch(80% 0.15 62);
  --font-display: "Instrument Serif", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-body: "Geist", "Microsoft YaHei UI", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-outlier: "Geist Mono", "Microsoft YaHei UI", "PingFang SC", ui-monospace, monospace;
  --radius-card: 10px; --radius-pill: 999px; --rule-hair: 1px;
  --shadow-card: 0 28px 64px -30px oklch(4% 0.02 290 / 0.8);
  --tracking-display: -0.015em; --display-weight: 400;

  /* 项目语义：等人 / 机器在动 / 出问题 / 收口 */
  --color-wait: var(--color-accent);
  --color-wait-soft: oklch(80% 0.15 62 / 0.12);
  --color-run: oklch(80% 0.09 228);
  --color-run-soft: oklch(80% 0.09 228 / 0.13);
  --color-bad: var(--color-accent-2);
  --color-bad-soft: oklch(72% 0.15 12 / 0.14);
  --color-ok: var(--color-live);
  --color-ok-soft: oklch(80% 0.13 155 / 0.12);
  --color-accent-hover: oklch(85% 0.14 62);
  --color-scrim: oklch(6% 0.02 290 / 0.6);

  --top-h: 52px;
  --side-w: 248px;
  --panel-w: 300px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html, body { height: 100%; }
html { scrollbar-color: var(--color-rule-2) var(--color-paper); }
body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-size: var(--text-sm); line-height: 1.55; -webkit-font-smoothing: antialiased; caret-color: var(--color-accent); font-variant-numeric: tabular-nums; }
::selection { background: color-mix(in oklab, var(--color-accent) 22%, transparent); color: var(--color-ink); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.16em; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight); font-synthesis: none; letter-spacing: var(--tracking-display); line-height: 1.1; overflow-wrap: break-word; min-width: 0; text-wrap: balance; color: var(--color-ink); }
p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
p { text-wrap: pretty; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
[hidden] { display: none !important; }
code, kbd, .m { font-family: var(--font-outlier); font-size: 0.8125rem; font-weight: 400; }
.ic { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--color-muted); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ── 控件 ───────────────────────────── */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: 32px; padding: 0 var(--space-sm); border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: 500; white-space: nowrap; color: var(--color-ink); box-shadow: inset 0 0 0 var(--rule-hair) var(--color-rule-2); transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.btn::after { content: ""; position: absolute; inset: -6px 0; }
.btn:hover { background: var(--color-paper-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.pri { background: var(--color-accent); color: var(--color-accent-ink); box-shadow: none; }
.btn.pri:hover { background: var(--color-accent-hover); }
.btn.ghost { box-shadow: none; color: var(--color-muted); }
.btn.ghost:hover { color: var(--color-ink); background: var(--color-paper-3); }
.btn.ghost[aria-pressed="true"] { color: var(--color-ink); background: var(--color-paper-3); }
.btn.lg { min-height: 36px; padding: 0 var(--space-md); }
.btn.icon { padding: 0; width: 32px; }
.link { display: inline-flex; align-items: center; min-height: 32px; color: var(--color-ink-2); text-decoration: underline; text-decoration-color: var(--color-rule-2); text-underline-offset: 0.2em; transition: text-decoration-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out); }
.link:hover { color: var(--color-ink); text-decoration-color: var(--color-accent); }
.link:active { color: var(--color-ink-2); }

.tag { display: inline-flex; align-items: center; gap: var(--space-2xs); min-height: 22px; padding: 0 var(--space-xs); border-radius: var(--radius-pill); font-size: var(--text-xs); white-space: nowrap; color: var(--color-ink-2); box-shadow: inset 0 0 0 var(--rule-hair) var(--color-rule-2); }
.tag.wait { color: var(--color-wait); background: var(--color-wait-soft); box-shadow: none; }
.tag.run { color: var(--color-run); background: var(--color-run-soft); box-shadow: none; }
.tag.ok { color: var(--color-ok); background: var(--color-ok-soft); box-shadow: none; }
.tag.bad { color: var(--color-bad); background: var(--color-bad-soft); box-shadow: none; }
.count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 var(--space-2xs); border-radius: var(--radius-card); font-family: var(--font-outlier); font-size: var(--text-xs); color: var(--color-accent-ink); background: var(--color-wait); }
.count.run { color: var(--color-run); background: var(--color-run-soft); }
.st-wait { color: var(--color-wait); } .st-run { color: var(--color-run); } .st-ok { color: var(--color-ok); } .st-bad { color: var(--color-bad); }
.live { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--color-run); flex-shrink: 0; }
.live.on { background: var(--color-ok); }

.av { position: relative; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; font-size: var(--text-xs); font-weight: 500; color: var(--color-ink-2); background: var(--color-paper-3); box-shadow: inset 0 0 0 var(--rule-hair) var(--color-rule-2); }
.av.me { color: var(--color-accent-ink); background: var(--color-accent); box-shadow: none; }
.av.sm { width: 24px; height: 24px; font-size: 0.6875rem; }
.av .ring { position: absolute; inset: -3px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--color-run); }
.av .ring.wait { box-shadow: 0 0 0 1.5px var(--color-wait); }
.stack { display: flex; }
.stack .av { margin-left: calc(var(--space-2xs) * -1.5); box-shadow: 0 0 0 2px var(--color-paper); }
.stack .av:first-child { margin-left: 0; }

.meter { display: block; height: 3px; border-radius: 2px; background: var(--color-rule); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; background: var(--color-ink-2); transform-origin: left; }
.meter i.hot { background: var(--color-wait); }

/* ── 外壳 ───────────────────────────── */
.app { display: grid; grid-template-rows: var(--top-h) minmax(0, 1fr); height: 100dvh; }
.top { display: flex; align-items: center; gap: var(--space-xs); padding: 0 var(--space-sm); background: var(--color-paper); border-bottom: var(--rule-hair) solid var(--color-rule); min-width: 0; }
.mark { font-family: var(--font-display); font-size: var(--text-xl); line-height: 1; letter-spacing: var(--tracking-display); padding: 0 var(--space-xs) 0 var(--space-2xs); color: var(--color-ink); }
.menu-btn { display: none; }
.proj { position: relative; flex-shrink: 0; }
.proj-btn { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 32px; max-width: 240px; padding: 0 var(--space-xs) 0 var(--space-2xs); border-radius: var(--radius-pill); box-shadow: inset 0 0 0 var(--rule-hair) var(--color-rule-2); transition: background-color var(--dur-micro) var(--ease-out); }
.proj-btn:hover, .proj-btn[aria-expanded="true"] { background: var(--color-paper-3); }
.proj-btn:active { background: var(--color-paper-2); }
.proj-btn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.proj-btn .ic { width: 14px; height: 14px; color: var(--color-muted); }
.pmark { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; font-family: var(--font-display); font-size: var(--text-md); line-height: 1; color: var(--color-ink); background: var(--color-paper-3); }
.menu { position: absolute; top: calc(100% + var(--space-xs)); left: 0; z-index: var(--z-dropdown); width: 320px; padding: var(--space-xs); border-radius: var(--radius-card); background: var(--color-paper-3); box-shadow: var(--shadow-card); }
.menu-h { padding: var(--space-xs) var(--space-xs) var(--space-sm); font-size: var(--text-xs); color: var(--color-muted); }
.menu-i { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: var(--space-sm); width: 100%; min-height: 48px; padding: var(--space-xs); border-radius: var(--radius-card); transition: background-color var(--dur-micro) var(--ease-out); }
.menu-i:hover { background: var(--color-paper-2); }
.menu-i:active { background: var(--color-paper); }
.menu-i[aria-current="true"] { background: var(--color-paper-2); }
.menu-i .sub { display: block; font-size: var(--text-xs); color: var(--color-muted); }
.menu-sep { height: var(--rule-hair); margin: var(--space-xs) 0; background: var(--color-rule); }

.tabs { display: flex; align-items: stretch; align-self: stretch; gap: var(--space-3xs); flex: 1; min-width: 0; margin-left: var(--space-xs); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; display: inline-flex; align-items: center; gap: var(--space-xs); padding: 0 var(--space-sm); white-space: nowrap; color: var(--color-muted); transition: color var(--dur-micro) var(--ease-out); }
.tab::after { content: ""; position: absolute; left: var(--space-sm); right: var(--space-sm); bottom: -1px; height: 2px; border-radius: 2px; background: var(--color-ink); transform: scaleX(0); transition: transform var(--dur-short) var(--ease-out); }
.tab:hover { color: var(--color-ink-2); }
.tab:active { color: var(--color-ink); }
.tab[aria-selected="true"] { color: var(--color-ink); }
.tab[aria-selected="true"]::after { transform: scaleX(1); }
.tab .par { color: var(--color-muted); }
.tab-sep { width: var(--rule-hair); margin: var(--space-sm) var(--space-2xs); background: var(--color-rule-2); flex-shrink: 0; }
.tab-add { display: inline-grid; place-items: center; align-self: center; width: 32px; height: 32px; border-radius: 50%; color: var(--color-muted); flex-shrink: 0; transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out); }
.tab-add:hover { color: var(--color-ink); background: var(--color-paper-3); }
.tab-add:active { background: var(--color-paper-2); }
.top-r { display: flex; align-items: center; gap: var(--space-md); flex-shrink: 0; padding-left: var(--space-sm); }
.sync { display: inline-flex; align-items: center; gap: var(--space-xs); font-size: var(--text-xs); color: var(--color-muted); }
.search { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 32px; min-width: 200px; padding: 0 var(--space-sm); border-radius: var(--radius-pill); color: var(--color-muted); background: var(--color-paper-2); box-shadow: inset 0 0 0 var(--rule-hair) var(--color-rule-2); transition: color var(--dur-micro) var(--ease-out); }
.search:hover { color: var(--color-ink-2); }
.search:active { color: var(--color-ink); }
.search kbd { margin-left: auto; font-size: var(--text-xs); }

.body { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 0; }
.side { display: flex; flex-direction: column; gap: var(--space-lg); min-height: 0; overflow-y: auto; padding: var(--space-lg) var(--space-sm) var(--space-md); background: var(--color-paper-2); border-right: var(--rule-hair) solid var(--color-rule); }
.side-h { display: grid; gap: var(--space-2xs); padding: 0 var(--space-xs); }
.side-h h2 { font-size: var(--text-xl); }
.side-h p { font-size: var(--text-xs); color: var(--color-muted); }
.grp { display: grid; gap: var(--space-3xs); }
.grp-h { display: flex; align-items: center; justify-content: space-between; min-height: 24px; padding: 0 var(--space-2xs) var(--space-2xs) var(--space-xs); font-size: var(--text-xs); color: var(--color-muted); }
.grp-h .btn.icon { width: 24px; min-height: 24px; }
.nav { display: flex; align-items: center; gap: var(--space-sm); width: 100%; min-height: 34px; padding: 0 var(--space-sm) 0 var(--space-xs); border-radius: var(--radius-pill); color: var(--color-ink-2); transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out); }
.nav:hover { background: var(--color-paper-3); color: var(--color-ink); }
.nav:active { background: var(--color-paper); }
.nav[aria-current="page"] { background: var(--color-paper-3); color: var(--color-ink); }
.nav .ic { color: var(--color-muted); }
.nav[aria-current="page"] .ic { color: var(--color-ink); }
.nav .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .hashc { width: 16px; text-align: center; color: var(--color-muted); font-family: var(--font-outlier); }
.nav .aside { flex-shrink: 0; font-size: var(--text-xs); color: var(--color-muted); }
.nav.unread .lb { color: var(--color-ink); font-weight: 500; }
.side-f { margin-top: auto; display: grid; gap: var(--space-2xs); padding: var(--space-sm) var(--space-xs) 0; border-top: var(--rule-hair) solid var(--color-rule); font-size: var(--text-xs); color: var(--color-muted); }
.side-f .row { display: flex; justify-content: space-between; gap: var(--space-xs); }
.scrim { display: none; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { display: flex; align-items: center; gap: var(--space-md); min-height: 72px; padding: var(--space-md) var(--space-xl); border-bottom: var(--rule-hair) solid var(--color-rule); flex-shrink: 0; }
.head h1 { font-size: var(--text-2xl); }
.head .sub { font-size: var(--text-xs); color: var(--color-muted); margin-top: var(--space-2xs); }
.head .sp { flex: 1; }
.head .hash { font-family: var(--font-display); font-size: var(--text-2xl); color: var(--color-muted); line-height: 1; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }
.pad { padding: var(--space-lg) var(--space-xl) var(--space-2xl); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w); flex: 1; min-height: 0; }
.panel { min-height: 0; overflow-y: auto; border-left: var(--rule-hair) solid var(--color-rule); background: var(--color-paper); color: var(--color-ink); }
.panel-pad { padding: var(--space-lg) var(--space-md); display: grid; gap: var(--space-lg); align-content: start; }
.panel h2 { font-family: var(--font-body); font-size: var(--text-xs); font-weight: 400; letter-spacing: 0; color: var(--color-muted); }
.sec { display: grid; gap: var(--space-sm); margin-bottom: var(--space-xl); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-md); }
.sec-h h2 { font-size: var(--text-xl); }
.sec-h .aside { font-size: var(--text-xs); color: var(--color-muted); }

/* ── 控制台 ─────────────────────────── */
.figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: var(--space-xl); border-top: var(--rule-hair) solid var(--color-rule); border-bottom: var(--rule-hair) solid var(--color-rule); }
.figs > div { display: grid; gap: var(--space-2xs); padding: var(--space-md) var(--space-md) var(--space-md) 0; }
.figs > div + div { padding-left: var(--space-md); border-left: var(--rule-hair) solid var(--color-rule); }
.figs dt { font-size: var(--text-xs); color: var(--color-muted); }
.figs dd { font-family: var(--font-display); font-size: var(--text-3xl); line-height: 1; color: var(--color-ink); }
.figs dd .u { font-family: var(--font-outlier); font-size: var(--text-xs); color: var(--color-muted); margin-left: var(--space-2xs); }
.figs dd.wait { color: var(--color-wait); }
.figs dd.run { color: var(--color-run); }

.queue { border-radius: var(--radius-card); background: var(--color-paper-2); box-shadow: inset 0 0 0 var(--rule-hair) var(--color-rule); }
.q { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; align-items: center; gap: var(--space-md); padding: var(--space-sm) var(--space-md); }
.q + .q { border-top: var(--rule-hair) solid var(--color-rule); }
.q .what { min-width: 0; display: grid; gap: var(--space-3xs); }
.q .what b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-ink); }
.q .where { display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--space-xs); font-size: var(--text-xs); color: var(--color-muted); }
.q .where .crumb { display: inline-flex; gap: var(--space-2xs); }
.q .acts { display: flex; align-items: center; gap: var(--space-xs); }
.q .acts time { font-family: var(--font-outlier); font-size: var(--text-xs); color: var(--color-muted); margin-right: var(--space-xs); }
.q.done .what b, .q.done .where { color: var(--color-muted); }
.q.done .what b { text-decoration: line-through; text-decoration-color: var(--color-rule-2); }
.q .resolved { font-size: var(--text-xs); color: var(--color-muted); }

.tbl { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.tbl caption { text-align: left; padding: 0 0 var(--space-xs); }

const pct = ([a, b]) => Math.min(100, Math.round((a / b) * 100));
const meter = (pair) => `<span class="meter" role="img" aria-label="已用 ${pct(pair)}%"><i class="${pct(pair) > 75 ? 'hot' : ''}" style="transform:scaleX(${pct(pair) / 100})"></i></span>`;

// 路由放内存里，hash 只做可分享的同步（data: 与快照环境下 hash 不可写）
// #/console/<view>[/<arg>]  ·  #/<project>/<ws>/<view>[/<arg>]
S.hash = location.hash;
function parse() {
  const seg = (S.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  if (!seg.length || seg[0] === 'console') return { tab: 'console', view: seg[1] || 'overview', arg: seg[2] };
  const [p, ws, view, arg] = seg;
  if (!P[p] || !wsOf(p, ws)) return { tab: 'console', view: 'overview' };
  S.project = p;
  return { tab: ws, view: view || 'chat', arg };
}
const go = (h) => {
  if (h.startsWith('task:')) h = wsHash(S.project, S.route.tab, 'task', h.slice(5));
  S.hash = h;
  try { if (location.hash !== h) history.pushState(null, '', h); } catch (e) {}
  render();
};
const wsHash = (p, ws, view = 'chat', arg) => `#/${p}/${ws}/${view}${arg ? '/' + arg : ''}`;

function toast(msg) {
  const el = $('#toast');
  el.innerHTML = `<div class="toast">${msg}</div>`;
  clearTimeout(toast.h);
  toast.h = setTimeout(() => { el.innerHTML = ''; }, 2400);
}

function feed(items, p) {
  return items.map((m) => {
    if (m.day) return `<p class="day">${m.day}</p>`;
    if (m.tools) return `<div class="tools" aria-label="工具调用">${m.tools.map(([who, tool, arg]) => `<p class="tool"><span class="tw">${esc(A[who].n)}</span><code>${tool}</code><span class="tt">${esc(arg)}</span></p>`).join('')}</div>`;
    const a = A[m.who];
    return `<article class="msg">${av(m.who)}<div><p class="who"><b>${esc(a.n)}</b><span class="role">${esc(a.role)}</span><time>${m.t}</time></p>
      <p class="tx">${m.raw ? esc(m.tx).replace(/@(\S+)/g, '<span class="at">@$1</span>') : m.tx}</p>${m.card ? card(m.card, p) : ''}</div></article>`;

}

function composer(ph, target) {
  return `<form class="composer" data-act="send" data-target="${target}" data-endpoint="/api/threads/:id/messages">
    <label class="visually-hidden" for="cmp-${target}">消息</label>
    <textarea id="cmp-${target}" rows="2" placeholder="${esc(ph)}"></textarea>

function renderMain() {
  const r = S.route;
  const el = $('#main');
  if (r.tab === 'console') {
    S.lastConsole = r.view === 'pm' ? `pm/${r.arg}` : r.view;
    el.innerHTML = ({ overview: consoleOverview, inbox: consoleInbox, pm: consolePm, runs: consoleRuns }[r.view] || consoleStub)(r);
  } else {
    const w = wsOf(S.project, r.tab);
    lastViews[S.project + '/' + w.id] = r.view === 'task' ? `task/${r.arg}` : r.view;
    if (r.view === 'chat') S.read[w.id] = true;
    if (r.view === 'task') S.read[r.arg] = true;
    const fn = { chat: wsChat, task: wsTask, board: wsBoard, changes: wsChanges, tests: wsTests, agents: wsAgents }[r.view] || wsStub;
    el.innerHTML = fn(w, r);
  }
  el.querySelectorAll('.feed').forEach((f) => { f.scrollTop = f.scrollHeight; });
}

function head(title, sub, right = '', lead = '') {
  return `<div class="head">${lead}<div><h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div><span class="sp"></span>${right}</div>`;
}

function queue(items) {
  if (!items.length) return `<div class="empty"><b>没有等你处理的事</b><p>Agent 们在自己跑。需要你决定、批准或回复时，会先出现在这里。</p></div>`;
  return `<div class="queue">${items.map((i) => {
    const w = wsOf(i.p, i.ws);
    const t = taskOf(i.p, i.task)?.t;
    const done = S.resolved[i.id];
    const acts = done ? `<span class="resolved">${esc(done)}</span>` : i.acts.map(([label, kind], k) => {
      if (kind === 'review') return `<button class="btn" data-go="${wsHash(i.p, i.ws, 'changes')}">${label}</button>`;
      if (kind === 'reply') return `<button class="btn" data-go="${wsHash(i.p, i.ws, 'task', i.task)}">${label}</button>`;
      return `<button class="btn ${k === 0 ? 'pri' : ''}" data-act="resolve" data-id="${i.id}" data-endpoint="/api/inbox/${i.id}/resolve" data-decision="${kind}" data-label="你已${label}">${label}</button>`;
    }).join('');
    return `<div class="q ${done ? 'done' : ''}">
      <span><span class="tag ${i.tone}">${i.kind}</span></span>
      <div class="what"><b>${esc(i.tx)}</b>
        <p class="where"><span class="crumb">${esc(P[i.p].name)} › ${esc(w.name)} › <a class="ref" data-go="${wsHash(i.p, i.ws, 'task', i.task)}">${esc(t?.title || '')}</a></span><span>${esc(A[i.from].n)} 提出</span></p></div>
      <div class="acts"><time>${i.t}</time>${acts}</div>
    </div>`;
  }).join('')}</div>`;
}

  <div class="split">
    <div class="feedcol"><div class="feed"><div class="feed-in">${feed(items, p)}</div></div>${composer(`在「${t.title}」里回复，或 @ 成员`, `task:${t.id}`)}</div>

    </div></aside>
  </div>`;
}

  <div class="scroll"><div class="pad"><div class="tblwrap"><table class="tbl"><thead><tr><th>成员</th><th>角色</th><th>状态</th><th>当前</th><th class="r">今日用量</th></tr></thead><tbody>
  ${w.agents.map((x) => `<tr><td><span style="display:inline-flex;align-items:center;gap:var(--space-sm)">${av(x.a, x.st)}<span class="nm">${esc(A[x.a].n)}</span></span></td><td class="m muted">${esc(A[x.a].role)}</td><td>${x.st === 'run' ? '<span class="tag run">在跑</span>' : x.st === 'wait' ? '<span class="tag wait">等你</span>' : '<span class="tag">空闲</span>'}</td><td>${esc(x.doing)}</td><td class="r m">${x.tok}</td></tr>`).join('')}
  </tbody></table></div></div></div>`;
}

function wsStub(w, r) {
  const name = w.panels.find((x) => x[0] === r.view)?.[1] || ({ settings: '工作台设置' }[r.view]) || r.view;
  return `${head(esc(name), esc(w.name))}<div class="scroll"><div class="pad"><div class="empty"><b>沿用现有渲染器</b><p>这个板块沿用 components/panels/ 里的实现，只把入口换到左侧栏，原型不重画。</p></div></div></div>`;
}

// ── 交互 ────────────────────────────────────────────
function render() {
  S.route = parse();
  renderTop(); renderSide(); renderMain();
  $('#app').classList.remove('side-open');
  save();
}

// 原型不发请求：data-endpoint 标出接线后要调用的接口
function resolve(btn) {
  S.resolved[btn.dataset.id] = btn.dataset.label;
  toast(`原型本地记录：${btn.dataset.label}，接线后调用 ${btn.dataset.endpoint}`);
  renderTop(); renderSide(); renderMain();
}

function sendMsg(form) {
  const ta = form.querySelector('textarea');
  const tx = ta.value.trim();
  if (!tx) return;
  const [kind, id] = form.dataset.target.split(':');
  const now = new Date();
  const t = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  const m = { who: 'me', t, tx, raw: true };
  if (kind === 'pm') P[id].ws.find((w) => w.root).chat.push(m);
  else if (kind === 'ws') wsOf(S.project, id).chat.push(m);
  else (TASK_FEED[id] ||= [{ day: '今天' }]).push(m);
  renderMain();
  const mention = tx.match(/@(\S+)/);
  if (mention) toast(`提及了 ${esc(mention[1])}，它排进下一轮发言`);
}

document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); S.menu = false; go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]');
  if (!a) { if (S.menu && !e.target.closest('.menu')) { S.menu = false; renderTop(); } return; }
  const act = a.dataset.act;
  if (act === 'menu') { S.menu = !S.menu; renderTop(); }
  else if (act === 'proj') {
    const id = a.dataset.id; S.menu = false; S.project = id;
    if (S.route.tab === 'console' || a.dataset.stay) { render(); toast(`顶栏标签换成了「${P[id].name}」的工作台`); }
    else go(wsHash(id, P[id].ws[1]?.id || P[id].ws[0].id, 'chat'));
  }
  else if (act === 'resolve') resolve(a);
  else if (act === 'pmproj') { S.pmProject = a.dataset.id; renderMain(); }
  else if (act === 'members') { S.members = !S.members; save(); renderMain(); }
  else if (act === 'side') $('#app').classList.toggle('side-open');
  else if (act === 'mount') toast('挂载工作台：选插件，选父工作台，新标签出现在顶栏');
  else if (act === 'newproj') toast('新建项目：沿用现有对话框，原型未展开');
  else if (act === 'newtask') toast('新建任务：建好后在左侧「群聊」下出现一个任务群');
  else if (act === 'advance') toast('推进阶段需要先满足门槛：验收或审批');
  else if (act === 'palette') toast('Ctrl K：跨项目搜索工作台、任务和成员');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('tr.go')) { go(e.target.dataset.go); return; }
  if (e.target.matches('.composer textarea') && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(e.target.closest('form')); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); toast('Ctrl K：跨项目搜索工作台、任务和成员'); }
  if (e.key === 'Escape') { if (S.menu) { S.menu = false; renderTop(); } $('#app').classList.remove('side-open'); }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-act="send"]');
  if (f) { e.preventDefault(); sendMsg(f); }
});
window.addEventListener('popstate', () => { S.hash = location.hash; render(); });
render();
</script>
</body>
</html>
